<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thumbnail Builder</title>
</head>

<body>
    <p class="github-link">
        <a href="https://github.com/WSDOT-GIS/arcgis-map-thumbnail-builder/" target="_blank" rel="noopener">Fork me on GitHub</a>
    </p>
    <div class="container">
        <div id="map"></div>
        <div>
            <button id="screenshotButton" type="button">📷</button>
        </div>
        <div>
            <canvas id="screenshotCanvas" width="600" height="400"></canvas>
            <!-- <p>
                <a id="dataLink" href="#" target="_blank">link</a>
            </p> -->
        </div>
    </div>

    <div>
        <form id="addLayerForm">
            <input id="layerUrl" type="url" name="url" autocomplete="on" required="required" placeholder="http://www.example.com/ArcGIS/rest/services/ServiceFolder/ServiceName/MapServer"
            />
            <button type="submit">Add Layer</button>
        </form>
        <ul id="layersList"></ul>
    </div>
    <script type="module" src="./src/main.ts"></script>
</body>

</html>
